# GitHub Actions workflow for testing the Linux SDK example project
# Supports both x86_64 and ARM64 architectures running in parallel
name: Linux SDK Example CI Test

# Trigger conditions
on:
  # Run on pushes to main branches affecting examples
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'examples/**'
      - 'test-scripts/**'
      - 'Dockerfile'
      - '.github/workflows/linux-test.yml'
  # Run on pull requests to main branches affecting examples  
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'examples/**'
      - 'test-scripts/**'
      - 'Dockerfile'
      - '.github/workflows/linux-test.yml'
  # Allow manual triggering with custom parameters
  # TODO: we could remove test suite option later its just for testing purposes
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'SDK Version to test'
        required: false
        default: '0.800.5'
        type: string
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - python
          - java
          - nodejs
          - c

# Global environment variables
# TODO: This needs to be checked out from github or the app itself centralized
env:
  DEFAULT_SDK_VERSION: '0.800.5'

jobs:
  test-x86_64:
    name: Test x86_64 Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Create secure license file
      - name: Prepare license file
        run: |
          # Create a temporary directory with restricted permissions
          mkdir -p /tmp/scanbot-secrets
          chmod 700 /tmp/scanbot-secrets
          
          # Use a temporary variable to avoid direct secret exposure
          LICENSE_CONTENT="${{ secrets.SCANBOT_LICENSE_KEY }}"
          
          # Write license to a secure file with proper error handling
          if [ -n "$LICENSE_CONTENT" ]; then
            echo "$LICENSE_CONTENT" > /tmp/scanbot-secrets/license.key
            chmod 600 /tmp/scanbot-secrets/license.key
            echo "::add-mask::$(cat /tmp/scanbot-secrets/license.key)"
          else
            echo "ERROR: SCANBOT_LICENSE_KEY secret is not set"
            exit 1
          fi

      # Build the Docker image using the existing Dockerfile
      - name: Build Docker image (x86_64)
        run: |
          docker build \
            --build-arg SDK_VERSION=${{ inputs.sdk_version || env.DEFAULT_SDK_VERSION }} \
            --build-arg ARCH=linux-x86_64 \
            --target base \
            -t scanbot-linux-x86_64:latest .

      # Run the test suite using dedicated script
      - name: Run test suite (x86_64)
        run: |
          # Mount the license file securely into the container
          case "${{ inputs.test_suite || 'all' }}" in
            "python")
              docker run --rm \
                -v /tmp/scanbot-secrets:/secrets:ro \
                -e SCANBOT_LICENSE_FILE=/secrets/license.key \
                scanbot-linux-x86_64:latest /tests/test-python.sh
              ;;
            "java")
              docker run --rm \
                -v /tmp/scanbot-secrets:/secrets:ro \
                -e SCANBOT_LICENSE_FILE=/secrets/license.key \
                scanbot-linux-x86_64:latest /tests/test-java.sh
              ;;
            "nodejs")
              docker run --rm \
                -v /tmp/scanbot-secrets:/secrets:ro \
                -e SCANBOT_LICENSE_FILE=/secrets/license.key \
                scanbot-linux-x86_64:latest /tests/test-nodejs.sh
              ;;
            "c")
              docker run --rm \
                -v /tmp/scanbot-secrets:/secrets:ro \
                -e SCANBOT_LICENSE_FILE=/secrets/license.key \
                scanbot-linux-x86_64:latest /tests/test-c.sh
              ;;
            "all"|*)
              docker run --rm \
                -v /tmp/scanbot-secrets:/secrets:ro \
                -e SCANBOT_LICENSE_FILE=/secrets/license.key \
                scanbot-linux-x86_64:latest /tests/run-all-tests.sh
              ;;
          esac

      # Clean up sensitive files
      - name: Cleanup secrets
        if: always()
        run: |
          rm -rf /tmp/scanbot-secrets